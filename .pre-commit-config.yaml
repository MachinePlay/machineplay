# Install with `uv run pre-commit install`, so the hook uses this repo's .venv.

repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Same rev as the backend; bump both together. 0.16 widens the default rules.
  rev: v0.15.12
  hooks:
    - id: ruff-check
      args: [ --fix ]
    - id: ruff-format

- repo: local
  hooks:
    - id: mypy
      name: mypy
      # `uv run` so mypy sees the project's dependencies.
      entry: uv run mypy
      language: system
      types: [python]
      pass_filenames: false
