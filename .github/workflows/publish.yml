# Publish to PyPI via Trusted Publishing (OIDC) when a version tag is pushed.
# Release: bump `__version__` in machineplay/__init__.py, commit, then
#
#   git tag vX.Y.Z && git push origin vX.Y.Z
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Exact pin: setup-uv stopped publishing moving major tags after v7.
      - uses: astral-sh/setup-uv@v9.0.0

      - run: uv build

      - name: Check the tag matches the built version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged=${GITHUB_REF_NAME#v}
          if [ ! -f "dist/machineplay-${tagged}.tar.gz" ]; then
            echo "tag $GITHUB_REF_NAME does not match what was built:" >&2
            ls dist >&2
            exit 1
          fi

      - run: uvx twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Separate, so only a job running no project code can mint the OIDC token.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
